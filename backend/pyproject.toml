[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "sql-agent-plus-backend"
version = "0.1.0"
description = "FastAPI backend for SQL Genius (uv-managed)"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic>=1.18.4",
    "fastapi>=0.135.3",
    "greenlet>=3.3.2",
    "httpx>=0.28.1",
    "langchain-core>=1.2.27",
    "langchain-openai>=1.1.12",
    "langfuse>=4.15.1",
    "langgraph>=1.1.6",
    "langgraph-checkpoint-postgres>=3.0.5",
    "pgvector>=0.4.2",
    "psycopg[binary]>=3.3.3",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "pymysql>=1.1.2",
    "sqlalchemy>=2.0",
    "sqlglot>=30.2.1",
    "uvicorn[standard]>=0.44.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

# Cursor / Pyrefly：类型检查使用 uv 虚拟环境，勿回落到系统 Python
[tool.pyrefly]
python-interpreter-path = ".venv/bin/python"
python-version = "3.13"
